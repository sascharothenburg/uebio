<script>
function setHash(id){
  // Zustand still in die URL schreiben (kein Sprung), damit Hardware-Back
  // und pageshow das offene Akkordeon wiederherstellen können.
  try{
    if(id){ history.replaceState(null,'','#'+id); }
    else{ history.replaceState(null,'',location.pathname+location.search); }
  }catch(e){}
}
function closeAllAcc(except){
  document.querySelectorAll('.acc-head').forEach(function(b){
    if(b!==except){
      b.setAttribute('aria-expanded','false');
      if(b.nextElementSibling) b.nextElementSibling.classList.remove('open');
    }
  });
}
function toggleAcc(btn){
  var open = btn.getAttribute('aria-expanded')==='true';
  if(open){
    btn.setAttribute('aria-expanded','false');
    btn.nextElementSibling.classList.remove('open');
    setHash(null);
  } else {
    closeAllAcc(btn);
    btn.setAttribute('aria-expanded','true');
    btn.nextElementSibling.classList.add('open');
    setHash(btn.id);
  }
}
function openAcc(id){
  var btn = document.getElementById(id);
  if(!btn || !btn.classList.contains('acc-head')) return;
  closeAllAcc(btn);
  btn.setAttribute('aria-expanded','true');
  btn.nextElementSibling.classList.add('open');
  if(btn.scrollIntoView){ btn.scrollIntoView({block:'start'}); }
}
window.toggleAcc=toggleAcc;
window.openAcc=openAcc;
function accRestore(){
  var h=(location.hash||'').replace('#','');
  if(h){ openAcc(h); }
}
if(document.readyState!=='loading'){ accRestore(); }
else{ document.addEventListener('DOMContentLoaded', accRestore); }
window.addEventListener('hashchange', accRestore);
window.addEventListener('pageshow', accRestore);
</script>
<script src="ads.js"></script>
<script>
(function(){
  var preset = 2;   // zuletzt gewaehlter Preset-Betrag (Fallback)
  function buildUrl(eur){ return 'https://paypal.me/SaschaRothenburg/' + eur + 'EUR'; }
  function fmt(v){ return (Math.round(v*100)/100).toString().replace(',','.'); }
  function setGo(eur){
    var go = document.getElementById('coffeeGo');
    if(go) go.href = buildUrl(eur);
  }
  window.toggleCoffee = function(e){
    e.stopPropagation();
    var pop = document.getElementById('coffeePop');
    if(pop) pop.classList.toggle('open');
  };
  window.pickAmt = function(btn){
    preset = parseFloat(btn.getAttribute('data-eur'));
    document.querySelectorAll('.coffee-pop .amt').forEach(function(b){ b.classList.remove('sel'); });
    btn.classList.add('sel');
    var ci = document.getElementById('coffeeCustom'); if(ci) ci.value='';
    setGo(fmt(preset));
  };
  window.customAmt = function(){
    var ci = document.getElementById('coffeeCustom');
    var raw = (ci.value||'').replace(',','.').trim();
    var v = parseFloat(raw);
    document.querySelectorAll('.coffee-pop .amt').forEach(function(b){ b.classList.remove('sel'); });
    if(!isNaN(v) && v>0){
      setGo(fmt(v));
    } else {
      // leeres/ungueltiges Feld -> zurueck auf Preset und diesen wieder markieren
      var pb = document.querySelector('.coffee-pop .amt[data-eur="'+preset+'"]');
      if(pb) pb.classList.add('sel');
      setGo(fmt(preset));
    }
  };
  // Klick ausserhalb schliesst das Popover
  document.addEventListener('click', function(e){
    var pop = document.getElementById('coffeePop');
    if(!pop || !pop.classList.contains('open')) return;
    if(!e.target.closest('.coffee-wrap')) pop.classList.remove('open');
  });
})();
</script>
